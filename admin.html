<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAISON AL TEEB — الإدارة</title>
<style>:root{--gold:#d8ad4e;--green:#18352b}*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f7f2e8;color:#18352b}.hidden{display:none!important}.login-mode{min-height:100vh;background:#080808}.wrap{max-width:1100px;margin:30px auto;padding:20px}.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 8px 30px #0001;margin-bottom:20px}.home{position:fixed;top:18px;right:18px;z-index:10;padding:10px 16px;border-radius:10px;background:#111;color:#fff;text-decoration:none;font-weight:700}#loginCard{width:min(1000px,100%);min-height:620px;margin:5vh auto;padding:0;overflow:hidden;display:grid;grid-template-columns:42% 58%;background:#0d0d0d;color:#fff;border:1px solid #d4a84c88;border-radius:28px}.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 25px;background:#111;border-left:1px solid #d4a84c44}.brand img{width:230px;max-width:80%;margin-bottom:20px}.brand h1{color:var(--gold)}.brand p{color:#c9c0ad;line-height:2}.content{display:flex;align-items:center;justify-content:center;padding:50px}.inner{width:100%;max-width:470px}.content h2{text-align:center;font-size:30px;font-weight:500}.sub{text-align:center;color:var(--gold);margin-bottom:35px}.field{margin-bottom:20px}.field label{display:block;color:#d5c8ad;margin-bottom:8px}.login-input{width:100%;height:58px;padding:0 18px;border-radius:10px;border:1px solid #4b3a20;background:#151515;color:#fff;font-size:16px;direction:ltr}.options{display:flex;justify-content:space-between;margin:10px 0 25px;font-size:14px}.forgot{color:var(--gold);cursor:pointer}.login-btn{width:100%;height:60px;border:0;border-radius:10px;background:linear-gradient(135deg,#e1b95e,#b88728);font-size:18px;font-weight:700;cursor:pointer}.login-msg{color:var(--gold);text-align:center;min-height:20px}.security{text-align:center;color:#918978;font-size:13px;margin-top:25px}h1,h2{margin-top:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}textarea{min-height:100px}.full{grid-column:1/-1}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font:inherit}.primary{background:var(--green);color:#fff}.danger{background:#a33;color:#fff}.muted{background:#eee}.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#f0e0b7;color:#684d15;font-weight:700}.msg{padding:12px;border-radius:10px;background:#f1f5f2;margin:10px 0}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}img.thumb{width:65px;height:65px;object-fit:cover;border-radius:8px}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:7px 10px;font-size:13px}@media(max-width:700px){#loginCard{grid-template-columns:1fr;min-height:auto;margin-top:70px}.brand{padding:30px}.brand img{width:170px}.content{padding:30px 20px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:10px}.card{padding:16px}table{font-size:13px}}</style>
</head><body class="login-mode"><a href="/" class="home">⌂ الرئيسية</a><div class="wrap"><section id="loginCard"><div class="brand"><img src="/logo.png" alt="MAISON AL TEEB"><h1>MAISON AL TEEB</h1><p>لوحة الإدارة الآمنة<br>إدارة المنتجات والمحتوى</p></div><div class="content"><div class="inner"><h2>مرحباً بك في الإدارة</h2><div class="sub">تسجيل الدخول إلى لوحة الإدارة</div><form id="loginForm"><div class="field"><label>البريد الإلكتروني</label><input id="email" class="login-input" type="email" autocomplete="email" required></div><div class="field"><label>كلمة المرور</label><input id="password" class="login-input" type="password" autocomplete="current-password" required></div><div class="options"><label><input id="remember" type="checkbox" checked> تذكرني</label><a id="forgotPassword" class="forgot">نسيت كلمة السر؟</a></div><button id="loginButton" class="login-btn" type="submit">🔐 تسجيل الدخول</button><div id="loginMsg" class="login-msg"></div></form><div class="security">صلاحيات الإدارة محمية حسب الدور</div></div></div></section><section id="adminPanel" class="hidden"><div class="card"><div class="top"><div><h1>لوحة الإدارة</h1><span id="roleBadge" class="badge"></span></div><div class="row"><span id="userEmail"></span><button id="newProduct" class="muted">منتج جديد</button><button id="logoutBtn" class="danger">خروج</button></div></div><div id="status" class="msg">جاري تحميل المنتجات...</div></div><div id="editorCard" class="card"><h2 id="formTitle">إضافة منتج</h2><form id="productForm"><input id="productId" type="hidden"><div class="grid"><input id="name" placeholder="اسم المنتج" required><input id="nameFr" placeholder="Nom français"><input id="nameEn" placeholder="English name"><select id="category" required><option value="العطور">العطور</option><option value="الزيوت">الزيوت</option><option value="العناية بالجسم">العناية بالجسم</option><option value="لباس تقليدي">لباس تقليدي</option><option value="مكملات غذائية">مكملات غذائية</option><option value="أخرى">أخرى</option></select><input id="gender" value="للجنسين" placeholder="الجنس"><input id="size" placeholder="الحجم"><input id="price" type="number" step="0.01" min="0" placeholder="الثمن" required><input id="oldPrice" type="number" step="0.01" min="0" placeholder="الثمن القديم"><input id="discount" type="number" step="1" min="0" max="100" placeholder="التخفيض %"><label class="row"><input id="bestSeller" type="checkbox" style="width:auto"> الأكثر مبيعاً</label><input id="image" type="file" accept="image/*"><textarea id="description" class="full" placeholder="وصف المنتج"></textarea></div><br><div class="row"><button class="primary" type="submit">حفظ المنتج</button><button id="cancelEdit" class="muted" type="button">إلغاء</button></div></form></div><div class="card"><h2>المنتجات</h2><div style="overflow:auto"><table><thead><tr><th>ID</th><th>الصورة</th><th>المنتج</th><th>الفئة</th><th>الثمن</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="productsBody"></tbody></table></div></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script>
const cfg=window.MAISON_SUPABASE;const db=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let currentUser=null,currentRole=null,rows=[];const $=id=>document.getElementById(id);const canWrite=()=>currentRole==='admin'||currentRole==='manager';const canDelete=()=>currentRole==='admin';function msg(text,error=false){$('status').textContent=text;$('status').style.background=error?'#ffe8e8':'#f1f5f2'}function loginMsg(text,error=false){$('loginMsg').textContent=text;$('loginMsg').style.color=error?'#ff9b9b':'#d8ad4e'}function resetForm(){$('productForm').reset();$('productId').value='';$('gender').value='للجنسين';$('formTitle').textContent='إضافة منتج'}function setEditorAccess(){const disabled=!canWrite();$('editorCard').classList.toggle('hidden',disabled);$('newProduct').classList.toggle('hidden',disabled)}async function getRole(user){const {data,error}=await db.from('profiles').select('role').eq('id',user.id).maybeSingle();if(error)throw error;return data?.role||null}async function openAdmin(user){currentUser=user;currentRole=await getRole(user);if(!['admin','manager','cashier'].includes(currentRole)){await db.auth.signOut();$('adminPanel').classList.add('hidden');$('loginCard').classList.remove('hidden');loginMsg('هذا الحساب ليس لديه صلاحية للوصول إلى لوحة الإدارة.',true);return}$('loginCard').classList.add('hidden');$('adminPanel').classList.remove('hidden');document.body.classList.remove('login-mode');$('userEmail').textContent=user.email||'';$('roleBadge').textContent=currentRole==='admin'?'ADMIN':currentRole==='manager'?'MANAGER':'CASHIER';setEditorAccess();await loadProducts()}
async function loadProducts(){msg('جاري تحميل المنتجات...');const {data,error}=await db.from('products').select('id,name,name_fr,name_en,category,gender,size,price,old_price,discount,image,is_best_seller,description,active,created_at').order('id',{ascending:false});if(error){msg('تعذر تحميل المنتجات: '+error.message,true);return}rows=data||[];renderRows();msg(`${rows.length} منتج في قاعدة البيانات`)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function renderRows(){$('productsBody').innerHTML=rows.map(p=>`<tr><td>${p.id}</td><td>${p.image?`<img class="thumb" src="${esc(p.image)}" alt="">`:'—'}</td><td><b>${esc(p.name)}</b><br><small>${esc(p.size||'')}</small></td><td>${esc(p.category)}</td><td>${Number(p.price||0).toFixed(2)} MAD</td><td>${p.active?'نشط':'مخفي'}</td><td><div class="actions">${canWrite()?`<button class="small muted" onclick="editProduct(${p.id})">تعديل</button>`:''}${canDelete()?`<button class="small danger" onclick="deleteProduct(${p.id})">حذف</button>`:''}</div></td></tr>`).join('')}
function editProduct(id){const p=rows.find(x=>x.id===id);if(!p||!canWrite())return;$('productId').value=p.id;$('name').value=p.name||'';$('nameFr').value=p.name_fr||'';$('nameEn').value=p.name_en||'';$('category').value=p.category||'أخرى';$('gender').value=p.gender||'للجنسين';$('size').value=p.size||'';$('price').value=p.price??0;$('oldPrice').value=p.old_price??0;$('discount').value=p.discount??0;$('bestSeller').checked=!!p.is_best_seller;$('description').value=p.description||'';$('image').value='';$('formTitle').textContent='تعديل المنتج #'+p.id;scrollTo({top:0,behavior:'smooth'})}async function uploadImage(file){if(!file)return null;if(!canWrite())throw new Error('لا توجد صلاحية رفع الصور');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${currentUser.id}/${Date.now()}-${crypto.randomUUID()}.${ext||'jpg'}`;const {error}=await db.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(error)throw error;const {data}=db.storage.from('product-images').getPublicUrl(path);return data.publicUrl}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMsg('جاري التحقق...');$('loginButton').disabled=true;try{const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await openAdmin(data.user)}catch(err){loginMsg(err.message||'تعذر تسجيل الدخول',true)}finally{$('loginButton').disabled=false}});$('forgotPassword').addEventListener('click',async e=>{e.preventDefault();const email=$('email').value.trim();if(!email){loginMsg('دخل البريد الإلكتروني أولاً.',true);return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});loginMsg(error?error.message:'تم إرسال رابط تغيير كلمة السر إلى بريدك الإلكتروني.')});
$('productForm').addEventListener('submit',async e=>{e.preventDefault();if(!canWrite())return;const id=$('productId').value;try{msg('جاري الحفظ...');let image=rows.find(p=>String(p.id)===String(id))?.image||null;const file=$('image').files[0];if(file)image=await uploadImage(file);const payload={name:$('name').value.trim(),name_fr:$('nameFr').value.trim()||null,name_en:$('nameEn').value.trim()||null,category:$('category').value,gender:$('gender').value.trim()||'للجنسين',size:$('size').value.trim()||null,price:Number($('price').value||0),old_price:Number($('oldPrice').value||0),discount:Number($('discount').value||0),image,is_best_seller:$('bestSeller').checked,description:$('description').value.trim()||null,active:true};let result=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(result.error)throw result.error;resetForm();await loadProducts()}catch(err){msg('خطأ: '+(err.message||err),true)}});$('newProduct').addEventListener('click',resetForm);$('cancelEdit').addEventListener('click',resetForm);async function deleteProduct(id){if(!canDelete())return;if(!confirm('واش متأكد بغيتي تحذف هاد المنتج؟'))return;const {error}=await db.from('products').delete().eq('id',id);if(error){msg('تعذر الحذف: '+error.message,true);return}await loadProducts()}async function logout(){await db.auth.signOut();location.reload()}$('logoutBtn').addEventListener('click',logout);db.auth.onAuthStateChange(async(_event,session)=>{if(session?.user&&!currentUser){try{await openAdmin(session.user)}catch(err){loginMsg(err.message||'تعذر التحقق من الصلاحيات',true)}}});(async()=>{const {data}=await db.auth.getSession();if(data.session&&!currentUser){try{await openAdmin(data.session.user)}catch(err){loginMsg(err.message||'تعذر التحقق من الصلاحيات',true)}}})();
</script></body></html>
