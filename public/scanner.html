<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ماسح الباركود | Maison Al Teeb</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><style>:root{--g:#0e291b;--gold:#d4af37;--c:#faf8f5}*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}body{margin:0;background:var(--c);color:#222}.top{background:var(--g);color:var(--gold);padding:14px;text-align:center;font-weight:700;position:relative}.back{position:absolute;right:12px;top:8px;background:#fff;color:var(--g);border:1px solid var(--gold);border-radius:10px;padding:8px 12px;text-decoration:none;font-weight:800;font-size:14px}.wrap{max-width:700px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5dec9;border-radius:16px;padding:16px;margin-bottom:14px}.video{width:100%;aspect-ratio:4/3;background:#111;border-radius:12px;object-fit:cover}.row{display:flex;gap:8px;margin-top:12px}.btn,input{padding:12px;border-radius:10px;border:1px solid #ddd6c9;font:inherit}.btn{flex:1;font-weight:700;cursor:pointer}.primary{background:var(--gold);color:var(--g)}.secondary{background:var(--g);color:var(--gold)}input{width:100%;direction:ltr;text-align:left}.status{text-align:center;padding:10px;color:#777}.product{display:none}.product.show{display:block}.product img{width:100%;max-height:320px;object-fit:contain;border-radius:12px;background:#f5f1e8}.name{font-size:22px;font-weight:800;color:var(--g);margin-top:12px}.price{font-size:20px;color:#9a7612;font-weight:700}.link{display:block;text-align:center;background:var(--g);color:var(--gold);padding:12px;border-radius:10px;text-decoration:none;margin-top:12px}</style></head><body><div class="top"><a class="back" href="/admin.html">← Admin</a>MAISON AL TEEB • ماسح الباركود</div><main class="wrap"><div class="card"><h2>ماسح الباركود</h2><p>وجّه الكاميرا نحو باركود المنتج</p><video id="video" class="video" playsinline muted></video><div class="row"><button id="start" class="btn primary">📷 تشغيل الكاميرا</button><button id="stop" class="btn secondary">⏹ إيقاف</button></div><div id="status" class="status">جاري تجهيز قارئ الباركود…</div></div><div class="card"><strong>أو أدخل الباركود يدوياً</strong><div class="row"><input id="code" inputmode="numeric" placeholder="مثال: 6111234567890"><button id="search" class="btn secondary">بحث</button></div></div><div id="product" class="card product"></div></main><script>const db=supabase.createClient(MAISON_SUPABASE.url,MAISON_SUPABASE.anonKey),video=document.getElementById('video'),code=document.getElementById('code'),status=document.getElementById('status'),product=document.getElementById('product');let controls=null,busy=false,reader=null;const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function msg(t){status.textContent=t}function loadZXing(){return new Promise((resolve,reject)=>{if(window.ZXingBrowser)return resolve();const urls=['https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js','https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js'];let i=0;function next(){if(window.ZXingBrowser)return resolve();if(i>=urls.length)return reject(Error('ZXING_LOAD_FAILED'));const s=document.createElement('script');s.src=urls[i++];s.onload=()=>window.ZXingBrowser?resolve():next();s.onerror=next;document.head.appendChild(s)}next()})}async function find(codeValue){codeValue=String(codeValue||'').trim();if(!codeValue||busy)return;busy=true;code.value=codeValue;msg('جاري البحث…');try{const {data,error}=await db.from('products').select('id,name,category,size,price,image,description,stock,active,barcode').eq('barcode',codeValue).maybeSingle();if(error)throw error;if(!data){product.className='card product';product.innerHTML='';msg('لم يتم العثور على منتج بهذا الباركود');return}product.innerHTML='<img src="'+esc(data.image||'/logo.png')+'" onerror="this.src=\'/logo.png\'"><div class="name">'+esc(data.name)+'</div><p>الفئة: '+esc(data.category||'—')+'<br>الحجم: '+esc(data.size||'—')+'<br>المخزون: '+Number(data.stock||0)+'</p><div class="price">'+Number(data.price||0).toFixed(2)+' MAD</div>'+(data.description?'<p>'+esc(data.description)+'</p>':'')+'<a class="link" href="/?product='+encodeURIComponent(data.id)+'">عرض المنتج</a>';product.className='card product show';msg(data.active?'تم العثور على المنتج ✓':'المنتج غير نشط')}catch(e){console.error(e);msg('وقع خطأ أثناء البحث')}finally{busy=false}}async function start(){if(controls)return;try{msg('جاري تحميل قارئ الباركود…');await loadZXing();reader=new ZXingBrowser.BrowserMultiFormatReader();const devices=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();const cam=devices.find(d=>/back|rear|environment|arrière/i.test(d.label))||devices[devices.length-1];if(!cam)throw Error('NO_CAMERA');msg('الكاميرا تعمل…');controls=await reader.decodeFromVideoDevice(cam.deviceId,video,r=>{if(r)find(r.getText())})}catch(e){console.error(e);msg(e.message==='ZXING_LOAD_FAILED'?'تعذر تحميل قارئ الباركود. تحقق من الإنترنت ثم أعد المحاولة.':'تعذر تشغيل الكاميرا. تأكد من إذن الكاميرا.')}}function stop(){if(controls){try{controls.stop()}catch(e){}controls=null}if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null}msg('تم إيقاف الكاميرا')}document.getElementById('start').onclick=start;document.getElementById('stop').onclick=stop;document.getElementById('search').onclick=()=>find(code.value);code.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();find(code.value)}};loadZXing().then(()=>msg('قارئ الباركود جاهز ✓')).catch(()=>msg('تعذر تحميل قارئ الباركود — اضغط تشغيل الكاميرا لإعادة المحاولة'));window.onbeforeunload=stop;</script></body></html>
