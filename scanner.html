<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ماسح الباركود | Maison Al Teeb</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script><style>:root{--g:#0e291b;--gold:#d4af37;--c:#faf8f5;--l:#e5dec9}*{box-sizing:border-box;font-family:Tajawal,sans-serif}body{margin:0;background:var(--c);color:#222}.top{background:var(--g);color:var(--gold);padding:12px;text-align:center;font-weight:800}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.head{text-align:center}.head h1{color:var(--g)}.head p{color:#777}.scanner{position:relative;background:#111;border:2px solid var(--gold);border-radius:18px;overflow:hidden}.scanner video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.frame{position:absolute;inset:18% 10%;border:2px solid #fff8;border-radius:14px;pointer-events:none}.frame:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--gold);box-shadow:0 0 14px var(--gold)}.hint{text-align:center;color:#ddd;padding:10px;font-size:.85rem}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.btn{padding:13px;border:1px solid var(--gold);border-radius:10px;font-weight:700;font-size:1rem}.primary{background:var(--gold);color:var(--g)}.secondary{background:#fff;color:var(--g)}.manual,.product{background:#fff;border:1px solid var(--l);border-radius:14px;padding:14px}.manual label{display:block;font-weight:700;margin-bottom:7px}.row{display:flex;gap:8px}.row input{flex:1;padding:12px;border:1px solid var(--l);border-radius:9px;direction:ltr}.row button{padding:0 18px;border:0;border-radius:9px;background:var(--g);color:var(--gold);font-weight:700}.status{text-align:center;padding:12px;color:#777;min-height:24px}.ok{color:#18733b}.err{color:#b22222}.product{display:none;padding:0;overflow:hidden}.product.show{display:block}.product img{width:100%;max-height:300px;object-fit:contain;background:#f7f4ef}.info{padding:16px}.name{font-size:1.35rem;font-weight:800;color:var(--g)}.barcode{text-align:center;direction:ltr;font-family:monospace;color:#777;margin:5px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cell{background:#faf8f5;border-radius:9px;padding:10px}.cell small{display:block;color:#777}.cell strong{display:block;color:var(--g);margin-top:2px}.price{font-size:1.3rem;color:#a07d12}.open{display:block;text-align:center;text-decoration:none;margin-top:12px;background:var(--g);color:var(--gold);padding:12px;border-radius:10px;font-weight:700}@media(max-width:520px){.actions{grid-template-columns:1fr}}</style></head><body><div class="top">MAISON AL TEEB • ماسح الباركود</div><main class="wrap"><div class="head"><h1>ماسح الباركود</h1><p>وجّه الكاميرا نحو باركود المنتج</p></div><section class="scanner"><video id="preview" playsinline muted></video><div class="frame"></div><div class="hint">اسمح للمتصفح بالكاميرا وضع الباركود داخل الإطار</div></section><div class="actions"><button class="btn primary" id="start">📷 تشغيل الكاميرا</button><button class="btn secondary" id="stop">⏹ إيقاف الكاميرا</button></div><section class="manual"><label>أو أدخل الباركود يدوياً / قارئ USB أو Bluetooth</label><div class="row"><input id="code" inputmode="text" autocomplete="off" placeholder="مثال: 6111234567890"><button id="search">بحث</button></div></section><div id="status" class="status">جاهز للمسح</div><section id="product" class="product"></section></main><script>
const sb=window.supabase.createClient(window.MAISON_SUPABASE.url,window.MAISON_SUPABASE.anonKey),video=document.getElementById('preview'),input=document.getElementById('code'),statusEl=document.getElementById('status'),productEl=document.getElementById('product');let controls=null,busy=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t,c=''){statusEl.textContent=t;statusEl.className='status '+c}
async function findProduct(code){code=String(code||'').trim();if(!code||busy)return;busy=true;input.value=code;msg('جاري البحث عن المنتج…');try{const r=await sb.from('products').select('id,name,category,size,price,image,description,stock,active,barcode').eq('barcode',code).maybeSingle();if(r.error)throw r.error;if(!r.data){productEl.className='product';productEl.innerHTML='';msg('لم يتم العثور على منتج بهذا الباركود','err');return}const p=r.data;msg(p.active?'تم العثور على المنتج ✓':'هذا المنتج غير نشط حالياً',p.active?'ok':'err');const image=p.image||'https://placehold.co/600x450/f4efea/0e291b?text=Maison+Al+Teeb';productEl.innerHTML='<img src="'+esc(image)+'" onerror="this.src=\'https://placehold.co/600x450/f4efea/0e291b?text=Maison+Al+Teeb\'" alt="'+esc(p.name)+'"><div class="info"><div class="name">'+esc(p.name||'منتج')+'</div><div class="barcode">BARCODE: '+esc(p.barcode||code)+'</div><div class="grid"><div class="cell"><small>الفئة</small><strong>'+esc(p.category||'—')+'</strong></div><div class="cell"><small>المخزون</small><strong>'+String(p.stock??0)+'</strong></div><div class="cell"><small>الحجم</small><strong>'+esc(p.size||'—')+'</strong></div><div class="cell"><small>الثمن</small><strong class="price">'+Number(p.price||0).toFixed(2)+' MAD</strong></div></div>'+(p.description?'<p>'+esc(p.description)+'</p>':'')+'<a class="open" href="/?product='+encodeURIComponent(p.id)+'">عرض المنتج في Maison Al Teeb</a></div>';productEl.className='product show'}catch(e){console.error(e);msg('وقع خطأ أثناء البحث عن المنتج','err')}finally{busy=false}}
async function startCamera(){if(controls)return;if(!window.isSecureContext){msg('الكاميرا تحتاج HTTPS.','err');return}if(!window.ZXingBrowser){msg('تعذر تحميل قارئ الباركود. تحقق من اتصال الإنترنت.','err');return}try{const reader=new ZXingBrowser.BrowserMultiFormatReader(),devices=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();if(!devices.length)throw new Error('NO_CAMERA');const cam=devices.find(d=>/back|rear|environment|arrière|trasera/i.test(d.label))||devices[devices.length-1];msg('الكاميرا تعمل… قرّب الباركود');controls=await reader.decodeFromVideoDevice(cam.deviceId,video,r=>{if(r&&!busy)findProduct(r.getText())})}catch(e){console.error(e);controls=null;msg(e.name==='NotAllowedError'?'تم رفض إذن الكاميرا. اسمح بالكاميرا من إعدادات المتصفح.':e.message==='NO_CAMERA'?'لم يتم العثور على كاميرا.':'تعذر تشغيل الكاميرا. تأكد من الإذن وHTTPS.','err')}}
function stopCamera(){if(controls){try{controls.stop()}catch(e){}controls=null}if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null}msg('تم إيقاف الكاميرا')}document.getElementById('start').onclick=startCamera;document.getElementById('stop').onclick=stopCamera;document.getElementById('search').onclick=()=>findProduct(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();findProduct(input.value)}});window.addEventListener('beforeunload',stopCamera);
</script></body></html>
