<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ماسح الباركود | Maison Al Teeb</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script><style>:root{--g:#0e291b;--gold:#d4af37;--c:#faf8f5;--l:#e5dec9}*{box-sizing:border-box;font-family:Tajawal,sans-serif}body{margin:0;background:var(--c);color:#222}.top{background:var(--g);color:var(--gold);padding:12px;text-align:center;font-weight:800}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.head{text-align:center}.head h1{color:var(--g)}.head p{color:#777}.scanner{position:relative;background:#111;border:2px solid var(--gold);border-radius:18px;overflow:hidden}.scanner video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.frame{position:absolute;inset:18% 10%;border:2px solid #fff8;border-radius:14px;pointer-events:none}.frame:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--gold);box-shadow:0 0 14px var(--gold)}.hint{text-align:center;color:#ddd;padding:10px;font-size:.85rem}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.btn{padding:13px;border:1px solid var(--gold);border-radius:10px;font-weight:700;font-size:1rem}.primary{background:var(--gold);color:var(--g)}.secondary{background:#fff;color:var(--g)}.manual,.product{background:#fff;border:1px solid var(--l);border-radius:14px;padding:14px}.manual label{display:block;font-weight:700;margin-bottom:7px}.row{display:flex;gap:8px}.row input{flex:1;padding:12px;border:1px solid var(--l);border-radius:9px;direction:ltr}.row button{padding:0 18px;border:0;border-radius:9px;background:var(--g);color:var(--gold);font-weight:700}.status{text-align:center;padding:12px;color:#777;min-height:24px}.ok{color:#18733b}.err{color:#b22222}.product{display:none;padding:0;overflow:hidden}.product.show{display:block}.product img{width:100%;max-height:300px;object-fit:contain;background:#f7f4ef}.info{padding:16px}.name{font-size:1.35rem;font-weight:800;color:var(--g)}.barcode{text-align:center;direction:ltr;font-family:monospace;color:#777;margin:5px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cell{background:#faf8f5;border-radius:9px;padding:10px}.cell small{display:block;color:#777}.cell strong{display:block;color:var(--g);margin-top:2px}.price{font-size:1.3rem;color:#a07d12}.open{display:block;text-align:center;text-decoration:none;margin-top:12px;background:var(--g);color:var(--gold);padding:12px;border-radius:10px;font-weight:700}@media(max-width:520px){.actions{grid-template-columns:1fr}}<style>
.cartBox{background:#fff;border:2px solid #d4af37;border-radius:16px;padding:14px;margin:14px 0}.cartHead,.cartTotal{display:flex;justify-content:space-between;align-items:center;padding:8px 0}.cartHead strong{color:#0e291b;font-size:1.15rem}.cartItem{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-top:1px solid #eee;padding:12px 0}.cartItem small{display:block;color:#777;margin-top:3px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border:1px solid #d4af37;border-radius:8px;background:#fff;font-size:20px}.cartTotal{border-top:2px solid #eee;margin-top:5px;font-size:1.2rem}.cartTotal strong{color:#0e291b}.saleActions,.ticketBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.btn:disabled{opacity:.45}.empty{text-align:center;color:#777;padding:18px}.ticketModal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:999999;display:flex;align-items:center;justify-content:center;padding:14px}.ticketCard{position:relative;background:#fff;border-radius:18px;padding:16px;width:min(720px,100%);max-height:95vh;overflow:auto;text-align:center}.ticketCard h2{color:#0e291b}.ticketCard img{width:min(100%,560px);border:1px solid #ddd}.x{position:absolute;right:12px;top:10px;border:0;background:#eee;border-radius:50%;width:34px;height:34px}.ticketBtns .btn{min-height:48px}
@media(max-width:520px){.cartItem{grid-template-columns:1fr auto}.cartItem>strong{grid-column:1/-1;text-align:left}.saleActions,.ticketBtns{grid-template-columns:1fr}}
</style></style></head><body><div class="top">MAISON AL TEEB • ماسح الباركود</div><main class="wrap"><div class="head"><h1>ماسح الباركود</h1><p>وجّه الكاميرا نحو باركود المنتج</p></div><section class="scanner"><video id="preview" playsinline muted></video><div class="frame"></div><div class="hint">اسمح للمتصفح بالكاميرا وضع الباركود داخل الإطار</div></section><div class="actions"><button class="btn primary" id="start">📷 تشغيل الكاميرا</button><button class="btn secondary" id="stop">⏹ إيقاف الكاميرا</button></div><section class="manual"><label>أو أدخل الباركود يدوياً / قارئ USB أو Bluetooth</label><div class="row"><input id="code" inputmode="text" autocomplete="off" placeholder="مثال: 6111234567890"><button id="search">بحث</button></div></section><div id="status" class="status">جاهز للمسح</div><section id="product" class="product"></section></main><script>
const sb=window.supabase.createClient(window.MAISON_SUPABASE.url,window.MAISON_SUPABASE.anonKey);
const video=document.getElementById('preview'),input=document.getElementById('code'),statusEl=document.getElementById('status'),productEl=document.getElementById('product');
let controls=null,busy=false,cart=JSON.parse(localStorage.getItem('maisonalteeb_cart')||'[]');

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toFixed(2);
function msg(t,c=''){statusEl.textContent=t;statusEl.className='status '+c}
function saveCart(){localStorage.setItem('maisonalteeb_cart',JSON.stringify(cart));renderCart()}
function addToCart(p){
  if(!p.active){msg('المنتج غير نشط ولا يمكن بيعه','err');return}
  const stock=Number(p.stock||0), idx=cart.findIndex(x=>String(x.id)===String(p.id));
  if(idx>=0){
    if(cart[idx].qty>=stock){msg('لا يمكن تجاوز المخزون المتوفر','err');return}
    cart[idx].qty++;
  }else{
    if(stock<1){msg('هذا المنتج نفد من المخزون','err');return}
    cart.push({id:p.id,name:p.name,price:Number(p.price||0),barcode:p.barcode||input.value,size:p.size||'',image:p.image||'',qty:1});
  }
  saveCart(); msg('تمت إضافة المنتج إلى سلة المبيعات ✓','ok');
}
function renderCart(){
  let box=document.getElementById('cartBox'); if(!box)return;
  const total=cart.reduce((s,x)=>s+x.price*x.qty,0),count=cart.reduce((s,x)=>s+x.qty,0);
  box.innerHTML='<div class="cartHead"><strong>🛒 سلة المبيعات</strong><span>'+count+' منتج</span></div>'+
    (cart.length?cart.map((x,i)=>'<div class="cartItem"><div><b>'+esc(x.name)+'</b><small>'+esc(x.size||'')+' • '+money(x.price)+' MAD</small></div><div class="qty"><button onclick="changeQty('+i+',-1)">−</button><b>'+x.qty+'</b><button onclick="changeQty('+i+',1)">+</button></div><strong>'+money(x.price*x.qty)+' MAD</strong></div>').join(''):'<div class="empty">السلة فارغة — سكانِي أول منتج</div>')+
    '<div class="cartTotal"><span>المجموع</span><strong>'+money(total)+' MAD</strong></div>'+
    '<div class="saleActions"><button class="btn primary" id="confirmSale" '+(cart.length?'':'disabled')+'>✅ تأكيد البيع</button><button class="btn secondary" id="clearCart" '+(cart.length?'':'disabled')+'>🗑️ إفراغ السلة</button></div>';
  document.getElementById('confirmSale').onclick=confirmSale;
  document.getElementById('clearCart').onclick=()=>{cart=[];saveCart();msg('تم إفراغ السلة')};
}
window.changeQty=(i,d)=>{if(!cart[i])return;if(d>0)cart[i].qty++;else cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);saveCart()};

async function findProduct(code,autoAdd=true){
  code=String(code||'').trim(); if(!code||busy)return;
  busy=true; input.value=code; msg('جاري البحث عن المنتج…');
  try{
    const r=await sb.from('products').select('id,name,category,size,price,image,description,stock,active,barcode').eq('barcode',code).maybeSingle();
    if(r.error)throw r.error;
    if(!r.data){productEl.className='product';productEl.innerHTML='';msg('لم يتم العثور على منتج بهذا الباركود','err');return}
    const p=r.data;
    if(autoAdd) addToCart(p);
    const image=p.image||'https://placehold.co/600x450/f4efea/0e291b?text=Maison+Al+Teeb';
    productEl.innerHTML='<img src="'+esc(image)+'" onerror="this.src=\'https://placehold.co/600x450/f4efea/0e291b?text=Maison+Al+Teeb\'" alt="'+esc(p.name)+'"><div class="info"><div class="name">'+esc(p.name||'منتج')+'</div><div class="barcode">BARCODE: '+esc(p.barcode||code)+'</div><div class="grid"><div class="cell"><small>الفئة</small><strong>'+esc(p.category||'—')+'</strong></div><div class="cell"><small>المخزون</small><strong>'+String(p.stock??0)+'</strong></div><div class="cell"><small>الحجم</small><strong>'+esc(p.size||'—')+'</strong></div><div class="cell"><small>الثمن</small><strong class="price">'+money(p.price)+' MAD</strong></div></div></div>';
    productEl.className='product show';
  }catch(e){console.error(e);msg('وقع خطأ أثناء البحث عن المنتج','err')}finally{busy=false}
}
async function startCamera(){
  if(controls)return;
  if(!window.isSecureContext){msg('الكاميرا تحتاج HTTPS.','err');return}
  if(!window.ZXingBrowser){msg('تعذر تحميل قارئ الباركود. تحقق من اتصال الإنترنت.','err');return}
  try{
    const reader=new ZXingBrowser.BrowserMultiFormatReader(),devices=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
    if(!devices.length)throw new Error('NO_CAMERA');
    const cam=devices.find(d=>/back|rear|environment|arrière|trasera/i.test(d.label))||devices[devices.length-1];
    msg('الكاميرا تعمل… سكانِي المنتجات واحداً بعد الآخر');
    controls=await reader.decodeFromVideoDevice(cam.deviceId,video,r=>{if(r&&!busy)findProduct(r.getText(),true)});
  }catch(e){console.error(e);controls=null;msg(e.name==='NotAllowedError'?'تم رفض إذن الكاميرا. اسمح بالكاميرا من إعدادات المتصفح.':e.message==='NO_CAMERA'?'لم يتم العثور على كاميرا.':'تعذر تشغيل الكاميرا. تأكد من الإذن وHTTPS.','err')}
}
function stopCamera(){if(controls){try{controls.stop()}catch(e){}controls=null}if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null}msg('تم إيقاف الكاميرا')}
function ticketData(){
  const now=new Date(), total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  return {date:now.toLocaleString('fr-MA'),items:cart.map(x=>({...x})),total};
}
function makeTicketCanvas(data){
  const w=700,rowH=62,h=190+data.items.length*rowH+130, c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.fillStyle='#0e291b';ctx.textAlign='center';ctx.font='800 34px Arial';ctx.fillText('MAISON AL TEEB',w/2,48);ctx.font='700 22px Arial';ctx.fillText('منزل الطيب',w/2,82);
  ctx.strokeStyle='#d4af37';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(35,105);ctx.lineTo(w-35,105);ctx.stroke();
  ctx.fillStyle='#222';ctx.font='18px Arial';ctx.textAlign='right';ctx.fillText('التاريخ: '+data.date,w-40,140);
  let y=185;ctx.font='700 20px Arial';ctx.fillText('المنتج',w-330,y);ctx.fillText('الكمية',w-150,y);ctx.fillText('المجموع',90,y);y+=18;
  data.items.forEach(x=>{y+=rowH-8;ctx.font='18px Arial';ctx.fillStyle='#222';ctx.fillText(String(x.name).slice(0,28),w-330,y);ctx.fillText(String(x.qty),w-150,y);ctx.textAlign='left';ctx.fillText(money(x.price*x.qty)+' MAD',40,y);ctx.textAlign='right';ctx.strokeStyle='#ddd';ctx.beginPath();ctx.moveTo(40,y+15);ctx.lineTo(w-40,y+15);ctx.stroke()});
  y+=65;ctx.font='800 28px Arial';ctx.fillStyle='#0e291b';ctx.fillText('TOTAL: '+money(data.total)+' MAD',w-40,y);ctx.font='16px Arial';ctx.fillStyle='#777';ctx.fillText('شكراً لزيارتكم • Maison Al Teeb',w-40,y+45);
  return c;
}
function showTicket(data){
  const c=makeTicketCanvas(data), url=c.toDataURL('image/png');
  const old=document.getElementById('ticketModal');if(old)old.remove();
  const m=document.createElement('div');m.id='ticketModal';m.className='ticketModal';m.innerHTML='<div class="ticketCard"><button class="x" id="closeTicket">✕</button><h2>🎫 تيكي البيع</h2><img src="'+url+'" id="ticketImage"><div class="ticketBtns"><button class="btn primary" id="printTicket">🖨️ طبع / Bluetooth</button><button class="btn secondary" id="saveTicket">📥 حفظ كصورة PNG</button></div><div class="ticketBtns"><button class="btn secondary" id="shareTicket">📤 مشاركة / Bluetooth</button><button class="btn secondary" id="newSale">🛒 بيع جديد</button></div></div>';document.body.appendChild(m);
  document.getElementById('closeTicket').onclick=()=>m.remove();
  document.getElementById('saveTicket').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='ticket-maison-al-teeb-'+Date.now()+'.png';a.click()};
  document.getElementById('shareTicket').onclick=async()=>{try{const blob=await (await fetch(url)).blob();const file=new File([blob],'ticket-maison-al-teeb.png',{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]}))await navigator.share({title:'Ticket Maison Al Teeb',files:[file]});else alert('شارك الصورة المحفوظة عبر Bluetooth من الهاتف.')}catch(e){}};
  document.getElementById('printTicket').onclick=()=>{const win=window.open('','_blank');if(!win){alert('اسمح بالنوافذ المنبثقة للطباعة');return}win.document.write('<html><head><title>Ticket Maison Al Teeb</title><style>body{margin:0;text-align:center}img{max-width:100%;width:80mm}</style></head><body><img src="'+url+'"><script>window.onload=()=>window.print()<\/script></body></html>');win.document.close()};
  document.getElementById('newSale').onclick=()=>m.remove();
}
function confirmSale(){
  if(!cart.length)return;
  const data=ticketData();
  const history=JSON.parse(localStorage.getItem('maisonalteeb_sales')||'[]');history.unshift({id:Date.now(),...data});localStorage.setItem('maisonalteeb_sales',JSON.stringify(history.slice(0,100)));
  cart=[];saveCart();showTicket(data);msg('تم تأكيد البيع ✓','ok');
}
document.getElementById('start').onclick=startCamera;document.getElementById('stop').onclick=stopCamera;document.getElementById('search').onclick=()=>findProduct(input.value,true);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();findProduct(input.value,true)}});window.addEventListener('beforeunload',stopCamera);
renderCart();
</script>
